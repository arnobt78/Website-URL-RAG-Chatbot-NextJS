name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  # Runs only when JINA_API_KEY is configured in repo secrets (Settings → Secrets).
  ingest-smoke:
    needs: verify
    if: ${{ secrets.JINA_API_KEY != '' }}
    runs-on: ubuntu-latest
    env:
      RUN_LIVE_INGEST_SMOKE: "1"
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:live-ingest
