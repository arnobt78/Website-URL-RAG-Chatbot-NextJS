name: Bug report
description: Something is broken or behaves unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do **not** paste API keys, `.env` values, or private site credentials.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong in one or two sentences?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps others can follow
      placeholder: |
        1. Open …
        2. Paste URL …
        3. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: e.g. local Node 24 / Vercel production / browser
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots (optional)
      description: Redact secrets. Prefer crawl phase / status JSON without keys.
