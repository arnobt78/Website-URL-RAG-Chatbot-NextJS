name: Feature request
description: Suggest an improvement or new capability
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem first. Large crawl/LLM changes usually need an Agile V REQ before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user need is unmet today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work at a high level?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: scope
    attributes:
      label: Scope notes
      options:
        - label: Does not require live Firecrawl keys in CI
        - label: Does not introduce a parallel RAG/LLM stack
        - label: Willing to help with a PR after Gate approval
